{% extends 'base.html' %}
{% block content %}
<section class="hero-panel">
    <div class="hero-copy">
        <span class="hero-status">DISCOVER MODE ACTIVE</span>
        <h1>Encuentra tu pareja técnica ideal.</h1>
        <p>Explora talentos, revisa su stack y descubre quién está listo para colaborar en el siguiente challenge.</p>
        <div class="hero-actions">
            <a href="/matches" class="button button-primary">Ver coincidencias</a>
            <a href="/dashboard" class="button button-outline">Ver perfil destacado</a>
        </div>
    </div>
    <div class="hero-visual">
        <div class="hero-block">
            <div class="hero-card">
                <img src="/static/images/devmatch-logo.svg" alt="DevMatch logo illustration" class="hero-illustration" />
                <div class="hero-brand-copy">
                    <strong>devMatch</strong>
                    <span>swipe. match. commit.</span>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
