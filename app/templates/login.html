{% extends 'base.html' %}
{% block content %}
<section class="auth-panel">
    <div class="auth-box">
        <div class="auth-header">
            <img src="/static/images/devmatch-logo.svg" alt="DevMatch logo" class="auth-logo-icon" />
            <div>
                <span class="auth-logo">DevMatch</span>
                <div class="auth-protocol">PROTOCOL: AUTH_V2.0.42</div>
            </div>
        </div>
        {% if registered %}
        <div class="auth-alert auth-alert-success">Account created successfully. Please log in.</div>
        {% endif %}
        {% if error %}
        <div class="auth-alert auth-alert-error">{{ error }}</div>
        {% endif %}
        <form class="auth-form" method="post" action="/login">
            <label>
                <span>USERNAME/ROOT</span>
                <input type="text" name="username" placeholder="user@devmatch_root" required />
            </label>
            <label>
                <span>ACCESS_KEY</span>
                <input type="password" name="password" placeholder="••••••••••" required />
            </label>
            <button type="submit" class="button button-primary">AUTHENTICATE_SESSION</button>
        </form>
        <div class="auth-meta">
            <a href="/register" class="auth-link">Create account</a>
            <span class="status-dot">NODE_STABLE</span>
        </div>
    </div>
</section>
{% endblock %}
