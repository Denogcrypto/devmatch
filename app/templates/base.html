<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title if title else 'DevMatch' }}</title>
    <link rel="icon" href="/static/images/devmatch-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand brand-with-logo">
                <img src="/static/images/devmatch-logo.svg" alt="DevMatch logo" class="brand-logo" />
                <span>DevMatch</span>
            </div>
            <nav class="main-nav">
                <a href="/dashboard">Dashboard</a>
                <a href="/discover">Discover</a>
                <a href="/matches">Matches</a>
                <a href="/profile">Profile</a>
            </nav>
            <div class="top-actions">
                {% if current_user %}
                <div class="user-menu" id="userMenu">
                    <button class="user-avatar" id="userMenuBtn" onclick="toggleUserMenu()">
                        {{ current_user[0] | upper }}
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <div class="user-dropdown-name">{{ current_user }}</div>
                        <a href="/profile" class="user-dropdown-item">Profile</a>
                        <a href="/logout" class="user-dropdown-item user-dropdown-logout">Logout</a>
                    </div>
                </div>
                {% else %}
                <a href="/login" class="button button-secondary">Login</a>
                {% endif %}
            </div>
            <script>
                function toggleUserMenu() {
                    document.getElementById('userDropdown').classList.toggle('open');
                }
                document.addEventListener('click', function(e) {
                    if (!document.getElementById('userMenu').contains(e.target)) {
                        document.getElementById('userDropdown').classList.remove('open');
                    }
                });
            </script>
        </header>

        <main class="page-content">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <div>© 2026 DevMatch. All rights reserved.</div>
            <div class="footer-links">
                <a href="#">Algorithm</a>
                <a href="#">API Docs</a>
                <a href="#">Security</a>
                <a href="#">GitHub</a>
            </div>
        </footer>
    </div>
</body>
</html>
