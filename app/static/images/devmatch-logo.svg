  <!-- < bracket -->
  <path d="M 108 122 L 88 140 L 108 158"
        stroke="white" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- > bracket -->
  <path d="M 172 122 L 192 140 L 172 158"
        stroke="white" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- / slash -->
  <path d="M 155 115 L 125 165"
