  </defs>

  <!-- Left card (tilted counter-clockwise) -->
  <rect x="80" y="62" width="120" height="158" rx="18" fill="#D8D8D8"
        transform="rotate(-12, 140, 141)"/>

  <!-- Right card (tilted clockwise) -->
  <rect x="80" y="62" width="120" height="158" rx="18" fill="#E4E4E4"
